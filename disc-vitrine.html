body{font-family:'Inter',sans-serif;background:var(--branco);color:var(--preto);font-size:14px;line-height:1.5}

.item{border:1px solid rgba(31,31,31,.08);border-radius:10px;padding:13px 15px;background:var(--branco)}
.item b{display:block;font-family:'Montserrat',sans-serif;font-size:13px;margin-bottom:3px}
.item span{font-size:12.5px;color:var(--cinza);line-height:1.55}
.acoes{display:flex;gap:10px;flex-wrap:wrap;margin-top:22px}
.btn{padding:13px 20px;border-radius:10px;border:1.5px solid var(--preto);font:700 14px 'Inter',sans-serif;cursor:pointer;text-decoration:none;display:inline-block}
.btn-p{background:var(--preto);color:var(--bege)}
.btn-s{background:#fff;color:var(--preto)}
.nota{font-size:12px;color:#8a847c;margin-top:14px;line-height:1.6}

.form .full{grid-column:1/-1}

.barra-l{display:grid;grid-template-columns:96px 1fr 46px;gap:10px;align-items:center;margin:8px 0;font-size:13px}

@media (max-width:600px){.perfil-s{font-size:42px}.barra-l{grid-template-columns:80px 1fr 40px}}

<script>
(function () {

  var MOD = (TOKEN_COMPRA || /disc-pessoal/.test(location.pathname)) ? 'pessoal' : 'executivo';
  var TITULO = MOD === 'pessoal' ? 'DISC Pessoal' : 'DISC Executivo';
  var WA = 'https://wa.me/5511947836879?text=' +
    encodeURIComponent('Olá! Vi a demonstração do ' + TITULO + ' da AXIS e quero saber mais.');

  var TEXTO = {
    executivo: {

      itens: [
        ['Perfil DISC completo', 'Dominante, Influente, Estável e Analítico, com natural e adaptado.'],
        ['24 capacidades', 'Seis por fator, com mapa atual e desejado.'],
        ['Índices exclusivos AXIS', 'Discrepância, positividade seletiva, autoestima, pontos de melhoria e influência do ambiente.'],
        ['Laudo de 36 páginas', 'Em PDF, com base científica e perguntas para a devolutiva.'],
        ['Mapa do time', 'Relatório de equipe com concentrações, lacunas e pares complementares.'],
        ['Resultado sob controle', 'O avaliado só vê o resultado depois que a consultora libera.']
      ],
      exemplo: { nome: 'Fernanda Lima', cargo: 'Diretora', empresa: 'Empresa de exemplo',
                 ordem: ['D', 'I', 'C', 'S'] },
      outro: '/vitrine/disc-pessoal', outroNome: 'DISC Pessoal'
    },
    pessoal: {
      eyebrow: 'Para você, para autoconhecimento',
      lead: 'Mostra o seu jeito natural de agir, se comunicar e reagir à pressão, e onde você está se adaptando para caber no que esperam de você. Um retrato honesto para entender as suas relações, as suas escolhas e o que vale ajustar.',
      itens: [
        ['Seu perfil DISC', 'Dominante, Influente, Estável e Analítico, do mais ao menos presente.'],
        ['Natural e adaptado', 'Quem você é e quem você tem precisado ser.'],
        ['24 capacidades', 'Onde você já está forte e onde quer crescer.'],
        ['Índices exclusivos AXIS', 'Mostram quando a autoimagem está generosa demais ou dura demais.'],
        ['Seu jeito nas relações', 'Como você se relaciona e convive, e o que aproxima ou afasta as pessoas de você.'],
        ['Laudo completo em PDF', '35 páginas em linguagem clara, liberadas na hora e enviadas ao seu e-mail.']
      ],
      exemplo: { nome: 'Camila Rocha', cargo: '', empresa: '',
                 ordem: ['I', 'S', 'D', 'C'] },
      outro: '/vitrine/disc-executivo', outroNome: 'DISC Executivo'
    }
  }[MOD];

  document.title = TITULO + ' | AXIS';
  document.getElementById('faixa-wa').href = WA;
  document.getElementById('modal-wa').href = WA;

  var tela = document.getElementById('tela');
  var app = document.getElementById('disc-exec-app');
  var modal = document.getElementById('modal');
  var vendoExemplo = false;

  function esc(s) { return String(s || '').replace(/[&<>"]/g, function (c) { return { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c]; }); }

  function abrirModal(texto) {
    document.getElementById('modal-p').textContent = texto;
    modal.classList.add('on');
  }
  document.getElementById('modal-fechar').onclick = function () { modal.classList.remove('on'); };
  modal.addEventListener('click', function (e) { if (e.target === modal) modal.classList.remove('on'); });

  // Na demonstração, o laudo completo do visitante e a exportação de dados
  // ficam para a versão contratada. O laudo do exemplo fictício abre, porque
  // é ele que mostra o produto.
  app.addEventListener('click', function (e) {
    var b = e.target.closest && e.target.closest('[data-act]');
    if (!b) return;
    var act = b.getAttribute('data-act');
    if ((act === 'json' && !(TOKEN_COMPRA && vendoExemplo)) || (act === 'laudo' && !vendoExemplo)) {
      e.preventDefault(); e.stopImmediatePropagation();
      abrirModal(act === 'laudo'
        ? 'O laudo completo em PDF, com o seu nome e a devolutiva da consultora, faz parte da avaliação contratada. Para ver como ele é, abra o resultado de exemplo.'
        : 'A exportação de dados faz parte da versão contratada.');
    }
  }, true);

  function capa() {
    vendoExemplo = false;
    app.style.display = 'none';
    tela.style.display = '';
    tela.innerHTML =
      '<div class="card">' +
        '<div class="eyebrow">' + esc(TEXTO.eyebrow) + '</div>' +
        '<h1>' + esc(TITULO) + '</h1>' +
        '<p class="lead">' + esc(TEXTO.lead) + '</p>' +
        '<div class="grade">' + TEXTO.itens.map(function (i) {
          return '<div class="item"><b>' + esc(i[0]) + '</b><span>' + esc(i[1]) + '</span></div>';
        }).join('') + '</div>' +
        '<div class="acoes">' +
          '<button class="btn btn-p" id="b-fazer">Fazer a avaliação agora</button>' +
          '<button class="btn btn-s" id="b-exemplo">' + (MOD === 'pessoal' ? 'Ver um laudo de exemplo' : 'Ver um resultado de exemplo') + '</button>' +
        '</div>' +
        (MOD === 'pessoal'
          ? '<div class="preco"><span>Seu perfil aparece na hora, sem pagar nada. Laudo completo em PDF:</span></div><div class="preco" style="margin-top:0"><b>R$ 29,90</b><span>pagamento único, Pix ou cartão</span></div>' +
            '<p class="nota">A avaliação tem 4 fases e leva de 15 a 25 minutos. No final você informa nome e e-mail para receber o seu perfil.</p>'
          : '<p class="nota">A avaliação tem 4 fases e leva de 15 a 25 minutos. Nesta demonstração o resultado aparece na hora e nada é enviado ao servidor. ' +
            'Na versão contratada, as respostas ficam registradas com confirmação por código no e-mail e o resultado é liberado pela consultora.</p>') +
      '</div>' +
      '<p class="outro">Procurando outra versão? Veja o <a href="' + TEXTO.outro + '">' + esc(TEXTO.outroNome) + '</a>.</p>';
    document.getElementById('b-fazer').onclick = fazer;
    document.getElementById('b-exemplo').onclick = exemplo;
  }

  function faixaTopo(texto) {
    tela.innerHTML = '<div class="saud"><span>' + texto + '</span><button id="b-voltar">Voltar ao início</button></div>';
    document.getElementById('b-voltar').onclick = function () {
      try { localStorage.removeItem('axis-disc-vitrine-' + MOD); } catch (e) {}
      location.reload();
    };
  }

  function fazer() {
    vendoExemplo = false;
    faixaTopo((MOD === 'pessoal' ? '' : 'Demonstração do ') + '<b>' + esc(TITULO) + '</b>. Responda com o que é verdade hoje.');
    app.style.display = '';
    // Sem aoFinalizar: o cálculo roda no próprio navegador e nada vai ao servidor.
    window.discExecIniciar({
      token: 'vitrine-' + MOD,
      modo: 'vitrine',
      modulo: MOD,
      titulo: TITULO,
      nome: 'Visitante',
      meta: { nome: 'Visitante', modulo: MOD },
      aoFinalizar: MOD === 'pessoal' ? pedirContato : undefined
    });
  }

  // Respostas fictícias e coerentes com um perfil, calculadas pelo mesmo
  // motor da avaliação real. Determinístico: o exemplo é sempre o mesmo.
  function respostasExemplo(ordem, semente) {
    semente = semente || 0;
    var D = window.DISC_EXEC;
    var peso = {}; ordem.forEach(function (f, i) { peso[f] = 4 - i; });
    var fator = function (cap) { return D.CAP_POR_ID[cap].fator; };
    var f1 = {}, f2 = {}, f3 = {}, f4 = [];
    D.FASE1.forEach(function (g, gi) {
      var caps = g.itens.map(function (i) { return i.cap; })
        .sort(function (a, b) { return peso[fator(b)] - peso[fator(a)]; });
      // alguns grupos trocam os dois primeiros, como acontece numa resposta real
      if ((gi + semente) % 4 === 2) caps = [caps[1], caps[0], caps[2], caps[3]];
      if ((gi + semente) % 5 === 4) caps = [caps[0], caps[2], caps[1], caps[3]];
      f1[g.g] = caps;
    });
    D.FASE2.forEach(function (q, i) {
      var base = { 4: 8, 3: 7, 2: 5, 1: 3 }[peso[fator(q.cap)]];
      f2[q.cap] = Math.max(1, Math.min(9, base + [0, 1, -1, 0][(i + semente) % 4]));
    });
    D.FASE3.forEach(function (q, i) {
      var p = peso[fator(q.cap)];
      f3[q.cap] = p === 4 ? (i % 2 ? 8 : 9) : p === 1 ? (i % 2 ? 14 : 15) : (i % 3 ? 11 : 13);
    });
    D.FASE4.filter(function (it) { return it.fator === ordem[0]; }).slice(0, 3)
      .forEach(function (it) { f4.push(it.id); });
    return { f1: f1, f2: f2, f3: f3, f4: f4, tempoSegundos: 1020 + semente * 97 };
  }

  function exemplo() {
    vendoExemplo = true;
    var ex = TEXTO.exemplo;
    var resultado = window.DISC_EXEC.calcular(respostasExemplo(ex.ordem));
    faixaTopo('Resultado de exemplo de <b>' + esc(ex.nome) + '</b>, pessoa fictícia. Role até o fim e abra o laudo completo.');
    app.style.display = '';
    window.discExecMostrarResultado(resultado, ex.nome, {
      nome: ex.nome, cargo: ex.cargo, empresa: ex.empresa, modulo: MOD, titulo: TITULO
    });
  }

  // ── PESSOAL: venda direta ────────────────────────────────────────
  // Ao terminar a fase 4, pede nome e e-mail, manda as respostas para o
  // servidor calcular e leva a pessoa para /meu-disc/TOKEN, onde ela vê o
  // perfil grátis e paga para liberar o laudo.
  function pedirContato(payload, cb) {
    var m = document.getElementById('modal');
    document.getElementById('modal-t').textContent = 'Seu perfil está pronto';
    var p = document.getElementById('modal-p');
    p.innerHTML =
      'Informe nome e e-mail para ver o seu perfil. Você também recebe uma cópia no e-mail.' +
      '<span style="display:block;text-align:left;margin-top:14px">' +
      '<input id="pc-nome" placeholder="Seu nome" autocomplete="name" style="width:100%;padding:12px;border:1.5px solid #e4e0da;border-radius:9px;font:15px Inter,sans-serif;margin-bottom:8px">' +
      '<input id="pc-email" type="email" placeholder="Seu e-mail" autocomplete="email" style="width:100%;padding:12px;border:1.5px solid #e4e0da;border-radius:9px;font:15px Inter,sans-serif;margin-bottom:10px">' +
      '<label class="aceite"><input type="checkbox" id="pc-aceite"><span>Li e aceito a <a href="/privacidade" target="_blank" rel="noopener">Política de Privacidade</a> e os <a href="/termos-de-uso" target="_blank" rel="noopener">Termos de Uso</a>.</span></label>' +
      '<span class="f-erro" id="pc-erro" style="margin-top:10px"></span></span>';
    var acoes = m.querySelector('.acoes');
    var acoesAntes = acoes.innerHTML;
    acoes.innerHTML = '<button class="btn btn-p" id="pc-ok">Ver meu perfil</button>';
    m.classList.add('on');
    function fechar(ok, msg) {
      m.classList.remove('on');
      acoes.innerHTML = acoesAntes;
      document.getElementById('modal-t').textContent = 'Isso faz parte da versão contratada';
      document.getElementById('modal-fechar').onclick = function () { m.classList.remove('on'); };
      if (!ok) cb(false, msg);
    }
    m.onclick = function (e) { if (e.target === m) fechar(false, 'Informe nome e e-mail para ver o seu perfil.'); };
    document.getElementById('pc-ok').onclick = function () {
      var btn = this, erro = document.getElementById('pc-erro');
      var nome = document.getElementById('pc-nome').value.trim();
      var email = document.getElementById('pc-email').value.trim();
      function falha(t) { erro.textContent = t; erro.style.display = 'block'; }
      if (!nome) return falha('Escreva o seu nome.');
      if (!/.+@.+\..+/.test(email)) return falha('Confira o seu e-mail.');
      if (!document.getElementById('pc-aceite').checked) return falha('Para continuar, aceite a Política de Privacidade.');
      btn.disabled = true; btn.textContent = 'Calculando...';
      fetch('/api/disc/pessoal/finalizar', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(Object.assign({ nome: nome, email: email, aceite: true }, payload))
      })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { btn.disabled = false; btn.textContent = 'Ver meu perfil'; return falha(j.error || 'Não foi possível calcular.'); }
        try { localStorage.removeItem('axis-disc-vitrine-pessoal'); } catch (e) {}
        location.href = '/meu-disc/' + j.token;
      })
      .catch(function () { btn.disabled = false; btn.textContent = 'Ver meu perfil'; falha('Sem conexão. Tente de novo.'); });
    };
  }

  function paginaCompra() {
    var F = window.DISC_EXEC.FATORES;
    var voltouDoPagamento = /[?&]pago=1/.test(location.search);
    var tentativas = 0;
    document.querySelector('.faixa span').textContent = 'DISC Pessoal AXIS';
    document.getElementById('faixa-wa').textContent = 'Dúvidas no WhatsApp';

    function carregar(conferir) {
      fetch('/api/disc/pessoal/status/' + TOKEN_COMPRA + (conferir ? '?conferir=1' : ''))
        .then(function (r) { return r.json(); })
        .then(function (j) {
          if (!j.ok) { tela.innerHTML = '<div class="card"><h2 class="sec">Link inválido</h2><p class="sub2">' + esc(j.error || '') + '</p></div>'; return; }
          if (j.pago) return liberado(j);
          gratis(j);
          if (voltouDoPagamento && tentativas < 30) { tentativas++; setTimeout(function () { carregar(true); }, 4000); }
        })
        .catch(function () { tela.innerHTML = '<div class="card"><h2 class="sec">Sem conexão</h2><p class="sub2">Recarregue a página.</p></div>'; });
    }

    function gratis(j) {
      var p = j.perfil, n = j.natural;
      var preco = 'R$ ' + Number(j.preco || 29.9).toFixed(2).replace('.', ',');
      tela.innerHTML =
        (voltouDoPagamento ? '<div class="aguarde"><b>Confirmando o seu pagamento...</b> Pix costuma confirmar em segundos. Esta página atualiza sozinha.</div>' : '') +
        '<div class="card">' +
          '<div class="eyebrow">Seu perfil DISC</div>' +
          '<div class="perfil-h"><div class="perfil-s" style="color:' + F[p.primario].cor + '">' + esc(p.sigla) + '</div>' +
            '<div style="font-size:15px">' + esc(j.nome.split(' ')[0]) + ', você é <b>' + esc(F[p.primario].estilo) + '</b> com apoio <b>' + esc(F[p.secundario].estilo) + '</b>.</div></div>' +
          '<div style="margin-top:16px">' + p.ranking.map(function (k) {
            return '<div class="barra-l"><b style="color:' + F[k].cor + '">' + esc(F[k].estilo) + '</b>' +
              '<div class="barra-t"><div class="barra-f" style="width:' + Math.round(n[k]) + '%;background:' + F[k].cor + '"></div></div>' +
              '<span>' + Math.round(n[k]) + '%</span></div>';
          }).join('') + '</div>' +
          '<p class="lead" style="margin-top:14px">' + esc(F[p.primario].resumo) + ' ' + esc(F[p.secundario].resumo) + '</p>' +
        '</div>' +
        '<div class="card" style="border-color:rgba(201,168,76,.6)">' +
          '<h2 class="sec">Seu laudo completo está pronto</h2>' +
          '<ul class="lista-laudo">' +
            '<li>Suas 24 capacidades, das mais fortes às menos presentes</li>' +
            '<li>Seu jeito nas relações: o que aproxima e o que afasta as pessoas de você</li>' +
            '<li>O que te move, o que te recarrega e como você decide</li>' +
            '<li>Quem você é por natureza e o quanto está se adaptando</li>' +
            '<li>Seis índices exclusivos AXIS sobre a sua autopercepção</li>' +
          '</ul>' +
          '<div class="preco"><b>' + preco + '</b><span>pagamento único, Pix ou cartão</span></div>' +
          '<div class="acoes" style="margin-top:12px"><button class="btn btn-p" id="b-pagar">Liberar meu laudo</button>' +
            '<button class="btn btn-s" id="b-exemplo">Ver um laudo de exemplo</button></div>' +
          '<div class="f-erro" id="pg-erro" style="margin-top:12px"></div>' +
          '<p class="nota">O laudo é um conteúdo digital liberado na hora: depois do pagamento, ele abre nesta página e o link chega no seu e-mail. Ao pagar, você concorda com os <a href="/termos-de-uso" target="_blank" rel="noopener">Termos de Uso</a>.</p>' +
        '</div>';
      document.getElementById('b-exemplo').onclick = exemplo;
      document.getElementById('b-pagar').onclick = function () {
        var btn = this, erro = document.getElementById('pg-erro');
        btn.disabled = true; btn.textContent = 'Abrindo o pagamento...'; erro.style.display = 'none';
        fetch('/api/disc/pessoal/pagar', { method: 'POST', headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ token: TOKEN_COMPRA }) })
          .then(function (r) { return r.json(); })
          .then(function (k) {
            if (k.ok && k.pago) return location.reload();
            if (k.ok && k.init_point) return (location.href = k.init_point);
            btn.disabled = false; btn.textContent = 'Liberar meu laudo';
            erro.textContent = k.error || 'Não foi possível abrir o pagamento.'; erro.style.display = 'block';
          })
          .catch(function () { btn.disabled = false; btn.textContent = 'Liberar meu laudo'; erro.textContent = 'Sem conexão.'; erro.style.display = 'block'; });
      };
    }

    function liberado(j) {
      vendoExemplo = true;   // laudo dela está pago: o botão abre
      tela.innerHTML = '<div class="aguarde" style="background:rgba(90,138,106,.12);border-color:rgba(90,138,106,.4)"><b>Laudo liberado.</b> Role até o fim e toque em "Abrir laudo completo" para ver e salvar em PDF.</div>';
      app.style.display = '';
      window.discExecMostrarResultado(j.resultado, j.nome, { nome: j.nome, modulo: 'pessoal', titulo: TITULO });
    }

    tela.innerHTML = '<div class="card"><h2 class="sec">Carregando o seu perfil...</h2></div>';
    carregar(voltouDoPagamento);
  }

  // ── EXECUTIVO: painel de uma empresa fictícia ──────────────────────
  // Mostra o que a empresa recebe: o time avaliado, o laudo de cada pessoa
  // e o mapa da equipe. Tudo calculado aqui pelo motor real, com respostas
  // fictícias. Nada vem do banco.
  var EMPRESA = 'Empresa Modelo (fictícia)';
  var TIME = [
    { nome:'Fernanda Lima',   cargo:'Diretora',                   ordem:['D','I','C','S'], st:'ok' },
    { nome:'Rafael Souza',    cargo:'Gerente Comercial',          ordem:['I','D','S','C'], st:'ok' },
    { nome:'Juliana Alves',   cargo:'Analista de RH',             ordem:['S','I','C','D'], st:'ok' },
    { nome:'Bruno Martins',   cargo:'Coordenador Financeiro',     ordem:['C','S','D','I'], st:'ok' },
    { nome:'Camila Rocha',    cargo:'Supervisora de Atendimento', ordem:['I','S','D','C'], st:'ok' },
    { nome:'Marcos Oliveira', cargo:'Analista de Processos',      ordem:['C','D','S','I'], st:'ok' },
    { nome:'Patrícia Gomes',  cargo:'Assistente Administrativa',  st:'and' },
    { nome:'Lucas Ferreira',  cargo:'Vendedor',                   st:'env' }
  ];
  var ROTULO_ST = { ok:'Concluída', and:'Respondendo', env:'Convite enviado' };

  function painelEmpresa() {
    var F = window.DISC_EXEC.FATORES;
    var hoje = new Date().toLocaleDateString('pt-BR');
    TIME.forEach(function (p, i) {
      if (p.ordem) p.resultado = window.DISC_EXEC.calcular(respostasExemplo(p.ordem, i));
    });
    var feitos = TIME.filter(function (p) { return p.resultado; });
    var cont = { D:0, I:0, S:0, C:0 };
    feitos.forEach(function (p) { cont[p.resultado.perfil.primario]++; });

    document.querySelector('.faixa span').textContent = 'Demonstração com uma empresa fictícia. Nenhum dado é real.';
    app.style.display = 'none';
    tela.style.display = '';
    tela.innerHTML =
      '<div class="card">' +
        '<div class="eyebrow">Para empresas, líderes e equipes</div>' +
        '<h1>DISC Executivo na sua empresa</h1>' +
        '<p class="lead">Veja abaixo como fica o painel de uma empresa fictícia que aplicou o DISC Executivo no time: quem já respondeu, o perfil de cada pessoa, o laudo individual e o mapa da equipe.</p>' +
        '<div class="passos">' +
          [['1','Você envia a lista do time','Nome, cargo e e-mail de quem será avaliado.'],
           ['2','Cada pessoa recebe o convite','Responde pelo celular, com código de confirmação no e-mail. Leva de 15 a 25 minutos.'],
           ['3','A AXIS acompanha e libera','O resultado só aparece para a pessoa depois da devolutiva.'],
           ['4','A empresa recebe o mapa','Laudo de cada pessoa e o relatório do time, com forças, lacunas e riscos.']]
          .map(function (x) { return '<div class="passo"><i>PASSO ' + x[0] + '</i><b>' + x[1] + '</b><span>' + x[2] + '</span></div>'; }).join('') +
        '</div>' +
      '</div>' +
      '<div class="card">' +
        '<h2 class="sec">' + esc(EMPRESA) + '</h2>' +
        '<div class="sub2">Painel do DISC Executivo &middot; atualizado em ' + hoje + '</div>' +
        '<div class="nums">' +
          '<div class="num"><b>' + TIME.length + '</b><span>convidados</span></div>' +
          '<div class="num"><b>' + feitos.length + '</b><span>concluídas</span></div>' +
          '<div class="num"><b>' + TIME.filter(function (p) { return p.st === 'and'; }).length + '</b><span>respondendo</span></div>' +
          '<div class="num"><b>' + TIME.filter(function (p) { return p.st === 'env'; }).length + '</b><span>aguardando</span></div>' +
        '</div>' +
        '<div style="font-size:12.5px;font-weight:600">Perfil predominante no time</div>' +
        '<div class="dist">' + ['D','I','S','C'].filter(function (k) { return cont[k]; }).map(function (k) {
            return '<div style="flex:' + cont[k] + ';background:' + F[k].cor + '">' + k + ' ' + cont[k] + '</div>';
          }).join('') + '</div>' +
        '<div class="legenda">' + ['D','I','S','C'].map(function (k) { return k + ' = ' + F[k].estilo; }).join(' &middot; ') + '</div>' +
        TIME.map(function (p, i) {
          var r = p.resultado;
          return '<div class="pessoa">' +
            '<div class="sigla" style="color:' + (r ? F[r.perfil.primario].cor : '#bbb') + '">' + (r ? r.perfil.sigla : '&middot;') + '</div>' +
            '<div class="nm"><b>' + esc(p.nome) + '</b><span>' + esc(p.cargo) + '</span></div>' +
            '<span class="chip ' + p.st + '">' + ROTULO_ST[p.st] + '</span>' +
            '<button class="mini" data-laudo="' + i + '"' + (r ? '' : ' disabled') + '>Laudo</button>' +
          '</div>';
        }).join('') +
        '<div class="acoes"><button class="btn btn-p" id="b-equipe">Abrir o mapa do time</button></div>' +
        '<p class="nota">O mapa do time mostra a distribuição dos perfis, quem é quem, as forças concentradas em poucas pessoas, as lacunas do grupo e os pares que mais se completam.</p>' +
      '</div>' +
      '<div class="card">' +
        '<h2 class="sec">Como o colaborador responde</h2>' +
        '<p class="sub2" style="margin-bottom:0">Veja por dentro as 4 fases que cada pessoa do time responde.</p>' +
        '<div class="acoes"><button class="btn btn-s" id="b-fazer">Ver a avaliação por dentro</button>' +
        '<button class="btn btn-p" id="b-ir-form">Quero aplicar na minha empresa</button></div>' +
      '</div>' +
      '<div class="card" id="contato">' +
        '<h2 class="sec">Quero o DISC Executivo na minha empresa</h2>' +
        '<p class="sub2" style="margin-bottom:0">Deixe seu contato e a AXIS chama você no WhatsApp para montar a proposta do seu time.</p>' +
        '<form id="f-contato" novalidate>' +
          '<div class="form">' +
            '<div><label for="c-nome">Nome</label><input id="c-nome" autocomplete="name" required></div>' +
            '<div><label for="c-email">E-mail</label><input id="c-email" type="email" autocomplete="email" required></div>' +
            '<div><label for="c-wa">WhatsApp com DDD</label><input id="c-wa" type="tel" inputmode="tel" autocomplete="tel" placeholder="(11) 90000-0000" required></div>' +
            '<div><label for="c-cargo">Cargo</label><select id="c-cargo" required><option value="">Selecione</option>' +
              ['Analista','Coordenador(a) ou supervisor(a)','Diretor(a)','Gerente','Outro','Recursos Humanos','Sócio(a) ou proprietário(a)']
                .map(function (c) { return '<option>' + c + '</option>'; }).join('') +
            '</select></div>' +
            '<div class="full"><label for="c-emp">Empresa (opcional)</label><input id="c-emp" autocomplete="organization"></div>' +
            '<div class="hp" aria-hidden="true"><input id="c-site" tabindex="-1" autocomplete="off"></div>' +
            '<label class="aceite full"><input type="checkbox" id="c-aceite"><span>Li e aceito a <a href="/privacidade" target="_blank" rel="noopener">Política de Privacidade</a>. Meus dados serão usados só para a AXIS entrar em contato sobre o DISC.</span></label>' +
            '<div class="f-erro full" id="c-erro"></div>' +
            '<div class="full"><button class="btn btn-p" type="submit" id="c-enviar">Quero ser chamado(a)</button></div>' +
          '</div>' +
        '</form>' +
      '</div>' +
      '<p class="outro">Quer fazer o seu, pessoal? Veja o <a href="' + TEXTO.outro + '">' + esc(TEXTO.outroNome) + '</a>.</p>';

    tela.querySelectorAll('[data-laudo]').forEach(function (b) {
      b.onclick = function () {
        var p = TIME[Number(b.getAttribute('data-laudo'))];
        if (!p.resultado) return;
        window.DISC_LAUDO.abrir(p.resultado, { nome: p.nome, cargo: p.cargo, empresa: EMPRESA, modulo: 'executivo', data: hoje });
      };
    });
    document.getElementById('b-equipe').onclick = function () {
      window.DISC_EQUIPE.abrir(feitos.map(function (p) {
        return { nome: p.nome, cargo: p.cargo, resultado: p.resultado };
      }), { empresa: EMPRESA, modulo: 'executivo' });
    };
    document.getElementById('b-fazer').onclick = fazer;
    function irForm(e) {
      if (e) e.preventDefault();
      document.getElementById('contato').scrollIntoView({ behavior: 'smooth' });
      setTimeout(function () { document.getElementById('c-nome').focus({ preventScroll: true }); }, 500);
    }
    document.getElementById('b-ir-form').onclick = irForm;
    var faixaLink = document.getElementById('faixa-wa');
    faixaLink.textContent = 'Quero aplicar na minha empresa';
    faixaLink.removeAttribute('target');
    faixaLink.href = '#contato';
    faixaLink.onclick = irForm;

    document.getElementById('f-contato').onsubmit = function (e) {
      e.preventDefault();
      var erro = document.getElementById('c-erro');
      var btn = document.getElementById('c-enviar');
      function falha(m) { erro.textContent = m; erro.style.display = 'block'; }
      erro.style.display = 'none';
      var v = function (id) { return document.getElementById(id).value.trim(); };
      var dados = {
        nome: v('c-nome'), email: v('c-email'), whatsapp: v('c-wa'), cargo: v('c-cargo'),
        empresaNome: v('c-emp'), site: v('c-site'),
        aceite: document.getElementById('c-aceite').checked,
        origem: location.pathname
      };
      if (!dados.nome) return falha('Escreva o seu nome.');
      if (!/.+@.+\..+/.test(dados.email)) return falha('Confira o seu e-mail.');
      if (dados.whatsapp.replace(/\D/g, '').length < 10) return falha('Escreva o WhatsApp com DDD.');
      if (!dados.cargo) return falha('Selecione o seu cargo.');
      if (!dados.aceite) return falha('Para enviar, aceite a Política de Privacidade.');
      btn.disabled = true; btn.textContent = 'Enviando...';
      fetch('/api/disc/vitrine-contato', {
        method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(dados)
      })
      .then(function (r) { return r.json(); })
      .then(function (j) {
        if (!j.ok) { btn.disabled = false; btn.textContent = 'Quero ser chamado(a)'; return falha(j.error || 'Não foi possível enviar.'); }
        document.getElementById('f-contato').outerHTML =
          '<div class="f-ok" style="margin-top:14px"><b>Recebido, ' + esc(dados.nome.split(' ')[0]) + '.</b><br>' +
          'A AXIS vai chamar você no WhatsApp. Se preferir adiantar, <a href="' + WA + '" target="_blank" rel="noopener">fale agora</a>.</div>';
      })
      .catch(function () { btn.disabled = false; btn.textContent = 'Quero ser chamado(a)'; falha('Sem conexão. Tente de novo.'); });
    };
  }

  if (TOKEN_COMPRA) paginaCompra();
  else if (MOD === 'executivo') painelEmpresa();
  else capa();
  // Atalhos vindos da página de anúncio (/disc-pessoal): já abre o teste ou o exemplo
  if (!TOKEN_COMPRA && MOD === 'pessoal') {
    if (/[?&]iniciar=1/.test(location.search)) fazer();
    else if (/[?&]exemplo=1/.test(location.search)) exemplo();
  }
})();
</script>
</body>
</html>
