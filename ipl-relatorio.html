<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Relatório IPL · Lideranças 360° · AXIS IA</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
<style>
  /* Mesma paleta clara do portal da empresa: o laudo deixou de destoar
     do resto da plataforma e ficou legível para imprimir e para gravar. */
  :root{
    --gold:#C9A84C; --gold-esc:#8C7126; --preto:#1F1F1F; --cinza:#4A4A4A;
    --fundo:#F5F5F3; --white:#fff; --border:#E4DED6; --text:#1F1F1F; --text-muted:#6B6B6B;
    --green:#5A8A6A; --yellow:#C9A84C; --orange:#D18B3C; --red:#B85C5C;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  body{background:var(--fundo);color:var(--text);font-family:'Segoe UI',Arial,sans-serif;padding-bottom:40px}
  .wrap{max-width:860px;margin:0 auto;padding:28px 20px}
  .logo{text-align:center;margin-bottom:8px}
  .logo h1{font-size:24px;color:var(--gold-esc);font-weight:700;letter-spacing:2px}
  .logo p{color:var(--text-muted);font-size:11px;letter-spacing:3px;text-transform:uppercase;margin-top:4px}
  /* Capa */
  .capa{background:var(--white);border:1px solid var(--border);border-radius:16px;padding:36px 28px;text-align:center;margin:24px 0;box-shadow:0 2px 10px rgba(31,31,31,.05)}
  .capa .sub{font-size:12px;color:var(--text-muted);letter-spacing:2px;text-transform:uppercase}
  .capa .nome{font-size:28px;font-weight:800;color:var(--preto);margin:10px 0 4px}
  .capa .meta{font-size:13px;color:var(--text-muted)}
  .score-ring{width:170px;height:170px;border-radius:50%;margin:26px auto 12px;display:flex;flex-direction:column;align-items:center;justify-content:center;border:8px solid var(--gold)}
  .score-ring .num{font-size:50px;font-weight:900;line-height:1}
  .score-ring .of{font-size:13px;color:var(--text-muted)}
  .classif{display:inline-block;font-size:15px;font-weight:700;padding:8px 20px;border-radius:24px;margin-top:6px}
  /* Cards perspectiva */
  .grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:24px 0}
  .pcard{background:var(--white);border:1px solid var(--border);border-radius:12px;padding:16px;text-align:center}
  .pcard .v{font-size:26px;font-weight:800;color:var(--gold-esc)}
  .pcard .l{font-size:11px;color:var(--text-muted);text-transform:uppercase;letter-spacing:1px;margin-top:4px}
  .sec{background:var(--white);border:1px solid var(--border);border-radius:14px;padding:24px;margin-bottom:20px}
  .sec h2{font-size:16px;color:var(--gold-esc);margin-bottom:16px;padding-bottom:10px;border-bottom:1px solid var(--border)}
  .radar-box{max-width:480px;margin:0 auto}
  .gap-box{background:rgba(201,168,76,.12);border:1px solid rgba(201,168,76,.45);border-radius:12px;padding:18px;text-align:center;margin-top:16px}
  .gap-box .v{font-size:30px;font-weight:800;color:var(--gold-esc)}
  .gap-box .l{font-size:13px;color:var(--cinza);margin-top:4px}
  /* Narrativa */
  #narrativa{line-height:1.85;font-size:15px;color:#333}
  #narrativa h2{color:var(--gold-esc);font-size:18px;margin:26px 0 12px;padding-bottom:8px;border-bottom:1px solid var(--border)}
  #narrativa h3{color:var(--preto);font-size:15px;margin:20px 0 8px}
  #narrativa p{margin:0 0 14px}
  #narrativa strong{color:var(--preto)}
  #narrativa em{color:var(--cinza);font-style:italic}
  #narrativa hr{border:none;border-top:1px solid var(--border);margin:22px 0}
  #narrativa blockquote{margin:16px 0;padding:10px 16px;border-left:3px solid var(--gold);
    background:rgba(201,168,76,.10);border-radius:0 8px 8px 0;color:var(--cinza)}
  #narrativa ul{margin:0 0 14px 22px}
  #narrativa li{margin-bottom:6px}
  .toolbar{display:flex;gap:10px;justify-content:center;margin:24px 0 8px;flex-wrap:wrap}
  .btn{background:var(--gold);color:#1F1F1F;border:none;border-radius:9px;padding:11px 22px;font-size:14px;font-weight:700;cursor:pointer}
  .btn.sec-btn{background:var(--white);color:var(--gold-esc);border:1px solid var(--gold)}
  #estado{text-align:center;padding:90px 20px}
  #estado .icon{font-size:42px;margin-bottom:14px}
  #estado h2{color:var(--gold-esc);margin-bottom:8px}
  #estado p{color:var(--cinza)}
  .hidden{display:none}
  .etica{font-size:12px;color:var(--text-muted);line-height:1.7;border-top:1px solid var(--border);padding-top:16px;margin-top:8px}
  @media(max-width:600px){.grid4{grid-template-columns:repeat(2,1fr)}}
  @media print{
    body{background:#fff;padding:0}
    .wrap{max-width:100%}
    .toolbar{display:none}
    .capa,.sec,.pcard,.gap-box{background:#fff;border:1px solid #ccc;break-inside:avoid}
    .classif,.score-ring{-webkit-print-color-adjust:exact;print-color-adjust:exact}
    @page{size:A4;margin:14mm 12mm}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><h1>AXIS IA</h1><p>Lideranças 360°, IPL</p></div>

  <div id="estado"><div class="icon">⏳</div><h2>Carregando relatório…</h2><p>Aguarde um instante.</p></div>

  <div id="conteudo" class="hidden">
    <div class="toolbar">
      <button class="btn" onclick="window.print()">📄 Gerar PDF</button>
      <button class="btn sec-btn" id="btn-email">✉ Enviar por E-mail</button>
    </div>

    <div class="capa">
      <div class="sub">Relatório de Performance de Liderança</div>
      <div class="nome" id="c-nome">—</div>
      <div class="meta" id="c-meta">—</div>
      <div class="score-ring" id="c-ring">
        <div class="num" id="c-score">—</div><div class="of">de 100</div>
      </div>
      <div><span class="classif" id="c-classif">—</span></div>
    </div>

    <div class="grid4">
      <div class="pcard"><div class="v" id="p-sub">—</div><div class="l">Subordinados</div></div>
      <div class="pcard"><div class="v" id="p-par">—</div><div class="l">Pares</div></div>
      <div class="pcard"><div class="v" id="p-sup">—</div><div class="l">Superior</div></div>
      <div class="pcard"><div class="v" id="p-auto">—</div><div class="l">Autoavaliação</div></div>
    </div>

    <div class="sec">
      <h2>Gráfico Radar: 8 Dimensões da Liderança</h2>
      <div class="radar-box"><canvas id="radar"></canvas></div>
      <div class="gap-box">
        <div class="v" id="gap-v">—</div>
        <div class="l" id="gap-l">Ponto cego do líder (autoavaliação − subordinados)</div>
      </div>
    </div>

    <div class="sec">
      <div id="narrativa"></div>
    </div>
  </div>
</div>

<script>
const qp = new URLSearchParams(location.search);
const CODIGO = qp.get('codigo');
const VERSAO = qp.get('versao') === 'admin' ? 'admin' : 'gestor';
const DIM_LABELS = ["Comunicação","Confiança","Apoio","Metas","Feedback","Justiça","Reconhecimento","Desenvolvimento"];
const DIM_KEYS = ["comunicacao","confianca","apoio","metas","feedback","justica","reconhecimento","desenvolvimento"];

function classifCor(score){
  if(score>=80) return '#5A8A6A';
  if(score>=60) return '#C9A84C';
  if(score>=40) return '#D18B3C';
  return '#B85C5C';
}
function showEstado(icon,t,p){
  document.getElementById('conteudo').classList.add('hidden');
  const e=document.getElementById('estado'); e.classList.remove('hidden');
  e.innerHTML=`<div class="icon">${icon}</div><h2>${t}</h2><p>${p}</p>`;
}
// markdown leve → HTML
function md(txt){
  if(!txt) return '';
  const linhas = txt.replace(/\r/g,'').split('\n');
  let out='', emLista=false;
  const inline = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
                       .replace(/\*\*(.+?)\*\*/g,'<strong>$1</strong>')
                       .replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  // Regra de escrita da AXIS: travessão não entra no texto que o cliente lê.
  // O prompt já pede isso, mas o modelo escorrega de vez em quando, e laudos
  // antigos foram escritos antes da regra. Em título o travessão vira
  // dois-pontos; no corpo, vírgula.
  const semTravessao = (s, titulo) => s
    .replace(/\s+—\s+/g, titulo ? ': ' : ', ')
    .replace(/—/g, titulo ? ':' : ',');
  for(let l of linhas){
    let t=l.trim();
    if(!t){ if(emLista){out+='</ul>';emLista=false;} continue; }
    t = semTravessao(t, /^#{1,3}\s/.test(t));
    // A IA escreve em markdown. O que não fosse tratado aqui aparecia cru
    // no relatório do cliente: título com #, régua --- e citação com >.
    if(/^-{3,}$/.test(t)){ if(emLista){out+='</ul>';emLista=false;} out+='<hr>'; continue; }
    if(/^>\s?/.test(t)){ if(emLista){out+='</ul>';emLista=false;}
      out += `<blockquote>${inline(t.replace(/^>\s?/,''))}</blockquote>`; continue; }
    if(/^#{1,3}\s/.test(t)){ if(emLista){out+='</ul>';emLista=false;}
      // O h1 da página já é o cabeçalho do laudo: o # do texto entra como h2.
      const nivel = t.startsWith('### ')?3:2; const txt2=t.replace(/^#{1,3}\s/,'');
      out += `<h${nivel}>${inline(txt2)}</h${nivel}>`; continue; }
    if(/^[-*•]\s/.test(t)){ if(!emLista){out+='<ul>';emLista=true;} out+=`<li>${inline(t.replace(/^[-*•]\s/,''))}</li>`; continue; }
    if(emLista){out+='</ul>';emLista=false;}
    out += `<p>${inline(t)}</p>`;
  }
  if(emLista) out+='</ul>';
  return out;
}

async function init(){
  if(!CODIGO){ showEstado('⚠️','Link inválido','Código do relatório ausente.'); return; }
  try{
    const r = await fetch(`/api/ipl/relatorio?codigo=${encodeURIComponent(CODIGO)}&versao=${VERSAO}`);
    const d = await r.json();
    if(!d.ok){ showEstado('⚠️','Relatório indisponível', d.error||'Tente novamente.'); return; }
    render(d);
  }catch(e){ showEstado('⚠️','Erro de conexão','Não foi possível carregar o relatório.'); }
}

function render(d){
  document.getElementById('estado').classList.add('hidden');
  document.getElementById('conteudo').classList.remove('hidden');
  document.getElementById('c-nome').textContent = d.gestorNome || '—';
  document.getElementById('c-meta').textContent =
    [d.gestorCargo, d.gestorSetor, d.empresaNome].filter(Boolean).join(' · ') || d.empresaNome || '';
  const cor = classifCor(d.iplScore);
  document.getElementById('c-score').textContent = d.iplScore;
  document.getElementById('c-score').style.color = cor;
  document.getElementById('c-ring').style.borderColor = cor;
  const cl = document.getElementById('c-classif');
  cl.textContent = d.classificacao || '';
  // O amarelo pede texto escuro; verde, laranja e vermelho pedem branco.
  cl.style.background = cor; cl.style.color = (cor === '#C9A84C' ? '#1F1F1F' : '#fff');

  const fmt = v => (v===null||v===undefined)?'N/D':v;
  document.getElementById('p-sub').textContent = fmt(d.iplSubordinados);
  document.getElementById('p-par').textContent = fmt(d.iplPares);
  document.getElementById('p-sup').textContent = fmt(d.iplSuperiores);
  document.getElementById('p-auto').textContent = fmt(d.iplAuto);

  document.getElementById('gap-v').textContent = (d.gap===null||d.gap===undefined)?'N/D':(d.gap>0?'+':'')+d.gap+' pts';

  // Radar
  const dims = d.dimensoes || {};
  const valores = DIM_KEYS.map(k => dims[k] ? dims[k].pontos : 0);
  new Chart(document.getElementById('radar'), {
    type:'radar',
    data:{ labels:DIM_LABELS, datasets:[{
      label:'Pontuação (0 a 20)', data:valores,
      backgroundColor:'rgba(201,168,76,.22)', borderColor:'#C9A84C',
      pointBackgroundColor:'#8C7126', borderWidth:2
    }]},
    options:{ responsive:true, scales:{ r:{
      min:0,max:20,ticks:{stepSize:5,color:'#8A8A8A',backdropColor:'transparent'},
      grid:{color:'#E4DED6'},angleLines:{color:'#E4DED6'},
      pointLabels:{color:'#4A4A4A',font:{size:11}}
    }}, plugins:{legend:{labels:{color:'#4A4A4A'}}} }
  });

  document.getElementById('narrativa').innerHTML = md(d.relatorio);

  document.getElementById('btn-email').addEventListener('click',()=>{
    const assunto = encodeURIComponent(`Relatório IPL: ${d.gestorNome}`);
    const corpo = encodeURIComponent(`Segue o link do Relatório de Liderança 360° (IPL):\n${location.href}`);
    window.location.href = `mailto:?subject=${assunto}&body=${corpo}`;
  });
}
init();
</script>
</body>
</html>
