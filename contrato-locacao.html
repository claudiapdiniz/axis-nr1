<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="apple-touch-icon" href="axis-logo.png">
<link rel="icon" href="axis-logo.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Contrato">
<meta name="theme-color" content="#123a94">
<meta name="robots" content="noindex, nofollow">
<title>Contrato de Locação de Veículo</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;500;600&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600&display=swap">

<style>
:root{
  --papel:#ffffff;
  --fundo:#eef1f6;
  --fundo-2:#f7f9fc;
  --tinta:#141a24;
  --tinta-2:#4a5568;
  --tinta-3:#7b8798;
  --linha:#d3dae6;
  --linha-forte:#b6c0d1;
  --azul:#123a94;
  --azul-claro:#e5ebf9;
  --ambar:#8a5a06;
  --ambar-claro:#fbf0d9;
  --verde:#1d6b45;
  --sombra:0 1px 2px rgba(18,26,40,.06), 0 8px 24px rgba(18,26,40,.06);
  --r:10px;
  --ui:"IBM Plex Sans", system-ui, -apple-system, Segoe UI, sans-serif;
  --serif:"Source Serif 4", Georgia, "Times New Roman", serif;
  --mono:"IBM Plex Mono", ui-monospace, Consolas, monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --papel:#171c25;
    --fundo:#0e1218;
    --fundo-2:#131922;
    --tinta:#e9edf4;
    --tinta-2:#a9b4c5;
    --tinta-3:#7d8898;
    --linha:#2a323f;
    --linha-forte:#3b4553;
    --azul:#8fb0ff;
    --azul-claro:#1b2540;
    --ambar:#e0b464;
    --ambar-claro:#2e2415;
    --verde:#6fd39f;
    --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --papel:#171c25;
  --fundo:#0e1218;
  --fundo-2:#131922;
  --tinta:#e9edf4;
  --tinta-2:#a9b4c5;
  --tinta-3:#7d8898;
  --linha:#2a323f;
  --linha-forte:#3b4553;
  --azul:#8fb0ff;
  --azul-claro:#1b2540;
  --ambar:#e0b464;
  --ambar-claro:#2e2415;
  --verde:#6fd39f;
  --sombra:0 1px 2px rgba(0,0,0,.4), 0 8px 24px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--fundo); color:var(--tinta);
  font-family:var(--ui); font-size:16px; line-height:1.5;
  -webkit-text-size-adjust:100%;
}
button, input, select, textarea{font:inherit; color:inherit}
:focus-visible{outline:2px solid var(--azul); outline-offset:2px; border-radius:4px}

/* ---------- cabeçalho ---------- */
.topo{
  position:sticky; top:0; z-index:30;
  background:var(--papel); border-bottom:1px solid var(--linha);
}
.topo-in{max-width:760px; margin:0 auto; padding:10px 16px; display:flex; align-items:center; gap:12px}
.marca{display:flex; flex-direction:column; gap:1px; min-width:0}
.marca b{font-size:15px; font-weight:600; letter-spacing:-.01em; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.marca span{font-size:11px; color:var(--tinta-3); letter-spacing:.08em; text-transform:uppercase}
.estado{margin-left:auto; font-size:11.5px; color:var(--tinta-3); text-align:right; line-height:1.3; max-width:130px}
.estado.ok{color:var(--verde)}

.abas{max-width:760px; margin:0 auto; padding:0 16px 10px; display:flex; gap:6px}
.aba{
  flex:1; padding:9px 10px; border:1px solid var(--linha); background:var(--fundo-2);
  color:var(--tinta-2); border-radius:8px; font-size:14px; font-weight:500; cursor:pointer;
}
.aba[aria-selected="true"]{background:var(--azul); border-color:var(--azul); color:#fff}
:root[data-theme="dark"] .aba[aria-selected="true"], :root:not([data-theme="light"]) .aba[aria-selected="true"]{color:#0e1218}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .aba[aria-selected="true"]{color:#fff}}

/* ---------- estrutura ---------- */
.tela{max-width:760px; margin:0 auto; padding:16px 16px 120px}
.oculto{display:none !important}

/* ---------- placa ---------- */
.placa{
  width:100%; max-width:250px; border:2px solid var(--tinta); border-radius:6px;
  overflow:hidden; background:#fff; color:#0b0f16;
}
.placa .faixa{
  background:#123a94; color:#fff; font-size:9px; letter-spacing:.28em;
  text-align:center; padding:2px 0; font-weight:600;
}
.placa .num{
  font-family:var(--mono); font-size:30px; font-weight:500; letter-spacing:.1em;
  text-align:center; padding:5px 0 8px;
}

/* ---------- cartões ---------- */
.grupo{background:var(--papel); border:1px solid var(--linha); border-radius:var(--r); margin-bottom:12px; box-shadow:var(--sombra)}
.grupo > summary{
  list-style:none; cursor:pointer; padding:14px 16px; display:flex; align-items:center; gap:10px;
  font-weight:600; font-size:15px;
}
.grupo > summary::-webkit-details-marker{display:none}
.grupo > summary::after{
  content:""; margin-left:auto; width:8px; height:8px; border-right:2px solid var(--tinta-3);
  border-bottom:2px solid var(--tinta-3); transform:rotate(45deg); transition:transform .15s;
}
.grupo[open] > summary::after{transform:rotate(-135deg)}
.grupo > summary .sub{font-weight:400; font-size:12.5px; color:var(--tinta-3); margin-left:2px}
.corpo{padding:0 16px 16px; display:grid; gap:12px}

.campo{display:grid; gap:5px}
.campo label{font-size:11.5px; text-transform:uppercase; letter-spacing:.07em; color:var(--tinta-3); font-weight:500}
.campo input, .campo select, .campo textarea{
  width:100%; padding:11px 12px; background:var(--fundo-2); color:var(--tinta);
  border:1px solid var(--linha); border-radius:8px;
}
.campo input::placeholder{color:var(--tinta-3)}
.campo.mono input{font-family:var(--mono); letter-spacing:.02em}
.dupla{display:grid; grid-template-columns:1fr 1fr; gap:12px}
.tripla{display:grid; grid-template-columns:2fr 1fr 1fr; gap:12px}
@media (max-width:520px){.tripla{grid-template-columns:1fr 1fr}.tripla .campo:first-child{grid-column:1 / -1}}

.aviso{
  background:var(--ambar-claro); border:1px solid color-mix(in srgb, var(--ambar) 30%, transparent);
  color:var(--ambar); border-radius:8px; padding:10px 12px; font-size:13px;
}

/* ---------- checklist ---------- */
.item-vist{display:grid; grid-template-columns:1fr auto; gap:8px; align-items:center; padding:9px 0; border-bottom:1px solid var(--linha)}
.item-vist:last-child{border-bottom:0}
.item-vist .nome{font-size:14px}
.tri{display:flex; gap:4px}
.tri button{
  border:1px solid var(--linha); background:var(--fundo-2); color:var(--tinta-2);
  padding:6px 11px; border-radius:7px; font-size:12.5px; cursor:pointer; white-space:nowrap;
}
.tri button[aria-pressed="true"]{background:var(--verde); border-color:var(--verde); color:#fff}
.tri button.ruim[aria-pressed="true"]{background:var(--ambar); border-color:var(--ambar); color:#fff}

/* ---------- fotos ---------- */
.fotos{display:grid; grid-template-columns:repeat(auto-fill, minmax(104px,1fr)); gap:10px}
.foto{position:relative; border:1px solid var(--linha); border-radius:8px; overflow:hidden; background:var(--fundo-2)}
.foto img{display:block; width:100%; aspect-ratio:4/3; object-fit:cover}
.foto input{
  width:100%; border:0; border-top:1px solid var(--linha); background:transparent;
  padding:6px 7px; font-size:11.5px;
}
.foto .x{
  position:absolute; top:5px; right:5px; width:26px; height:26px; border-radius:50%;
  border:0; background:rgba(10,14,20,.72); color:#fff; font-size:15px; line-height:1; cursor:pointer;
}
.add-foto{
  display:flex; align-items:center; justify-content:center; text-align:center;
  aspect-ratio:4/3; border:1.5px dashed var(--linha-forte); border-radius:8px;
  color:var(--tinta-2); font-size:12.5px; cursor:pointer; padding:8px; background:var(--fundo-2);
}

/* ---------- botões ---------- */
.barra{
  position:fixed; left:0; right:0; bottom:0; z-index:40;
  background:var(--papel); border-top:1px solid var(--linha);
  padding:10px 16px calc(10px + env(safe-area-inset-bottom));
}
.barra-in{max-width:760px; margin:0 auto; display:flex; gap:8px}
.bt{
  flex:1; padding:13px 14px; border-radius:9px; border:1px solid var(--linha);
  background:var(--fundo-2); color:var(--tinta); font-weight:500; cursor:pointer;
}
.bt.principal{background:var(--azul); border-color:var(--azul); color:#fff}
:root[data-theme="dark"] .bt.principal, :root:not([data-theme="light"]) .bt.principal{color:#0e1218}
@media (prefers-color-scheme: light){:root:not([data-theme="dark"]) .bt.principal{color:#fff}}
.bt.menor{flex:0 0 auto; padding:13px 16px}

/* ---------- lista de locações ---------- */
.lista{display:grid; gap:8px}
.linha-loc{
  display:flex; align-items:center; gap:12px; padding:12px 14px; background:var(--papel);
  border:1px solid var(--linha); border-radius:9px; cursor:pointer; text-align:left; width:100%;
}
.linha-loc[aria-current="true"]{border-color:var(--azul); background:var(--azul-claro)}
.linha-loc .qm{display:grid; gap:2px; min-width:0}
.linha-loc .qm b{font-weight:600; font-size:14.5px}
.linha-loc .qm span{font-size:12px; color:var(--tinta-3); font-family:var(--mono)}
.linha-loc .apagar{margin-left:auto; background:none; border:0; color:var(--tinta-3); font-size:12.5px; cursor:pointer; padding:6px}

/* ---------- documento ---------- */
.folha{
  background:var(--papel); border:1px solid var(--linha); border-radius:var(--r);
  padding:28px 26px 34px; box-shadow:var(--sombra);
  font-family:var(--serif); font-size:15px; line-height:1.62; color:var(--tinta);
}
.folha h1{
  font-size:19px; text-align:center; margin:0 0 4px; letter-spacing:.01em;
  font-family:var(--ui); font-weight:600; text-wrap:balance;
}
.folha .sub-doc{text-align:center; font-size:12.5px; color:var(--tinta-2); margin:0 0 22px; font-family:var(--ui)}
.folha h2{
  font-family:var(--ui); font-size:13px; font-weight:600; letter-spacing:.05em;
  margin:20px 0 6px; text-transform:uppercase;
}
.folha p{margin:0 0 10px; text-align:justify}
/* Coluna estreita no celular: justificar abre buracos entre as palavras.
   O papel continua justificado, que é como contrato se lê. */
@media (max-width:640px){
  .folha p, .folha ol.alin li{text-align:left; hyphens:auto}
  .folha{padding:20px 18px 26px}
}
.folha ol.alin{margin:0 0 10px; padding-left:22px}
.folha ol.alin li{margin-bottom:6px; text-align:justify}
.folha .val{font-weight:600}
.folha .vazio{color:var(--ambar); font-weight:600}
.folha .assin{margin-top:26px; display:grid; gap:20px}
.folha .assin div{border-top:1px solid var(--tinta-2); padding-top:5px; font-size:13.5px; max-width:420px; font-family:var(--ui)}
.folha .local-data{margin:24px 0 0; font-family:var(--ui); font-size:14px}
.quebra{border:0; border-top:1px dashed var(--linha-forte); margin:26px 0 20px}

table.vist{width:100%; border-collapse:collapse; font-family:var(--ui); font-size:12.5px; margin:8px 0 12px}
table.vist th, table.vist td{border:1px solid var(--linha-forte); padding:6px 8px; text-align:left; vertical-align:top}
table.vist th{background:var(--fundo-2); font-weight:600; font-size:11.5px; text-transform:uppercase; letter-spacing:.05em}
table.vist td.mk{text-align:center; width:74px; font-family:var(--mono)}
.dados-vist{font-family:var(--ui); font-size:13.5px; display:grid; gap:4px; margin-bottom:10px}
.fotos-doc{display:grid; grid-template-columns:1fr 1fr; gap:12px; margin:10px 0 6px}
.fotos-doc figure{margin:0; border:1px solid var(--linha-forte); border-radius:6px; overflow:hidden; break-inside:avoid}
.fotos-doc img{display:block; width:100%; aspect-ratio:4/3; object-fit:cover}
.fotos-doc figcaption{font-family:var(--ui); font-size:11px; padding:5px 7px; color:var(--tinta-2); border-top:1px solid var(--linha-forte)}

/* ---------- impressão ---------- */
@media print{
  @page{size:A4; margin:16mm 15mm}
  body{background:#fff; color:#000; font-size:11pt}
  .topo, .abas, .barra, .tela.form, .tela.lista, .so-tela{display:none !important}
  #tela-doc{display:block !important}
  .tela{padding:0; max-width:none}
  .folha{
    border:0; border-radius:0; box-shadow:none; padding:0; background:#fff; color:#000;
    font-size:11pt; line-height:1.45;
  }
  .folha h1{font-size:14pt} .folha h2{font-size:10.5pt; margin:14pt 0 4pt}
  .folha p{margin:0 0 7pt}
  .folha .vazio{color:#000}
  .folha .assin div{border-top:1px solid #000}
  table.vist th, table.vist td{border-color:#000}
  .fotos-doc figure{border-color:#666}
  .quebra{display:none}
  .pagina-nova{break-before:page}
  .folha h2, table.vist{break-after:avoid}
  .folha .assin{break-inside:avoid}
}

/* ---------- portão de senha ---------- */
.portao{
  position:fixed; inset:0; z-index:80; background:var(--fundo);
  display:flex; align-items:center; justify-content:center; padding:24px;
}
.portao.oculto{display:none}
.portao-caixa{
  width:100%; max-width:360px; background:var(--papel); border:1px solid var(--linha);
  border-radius:var(--r); box-shadow:var(--sombra); padding:26px 22px; display:grid; gap:12px;
}
.portao-caixa h1{font-size:18px; margin:0; font-weight:600}
.portao-caixa p{margin:0; font-size:13.5px; color:var(--tinta-2)}
.portao-caixa input{
  width:100%; padding:12px; border:1px solid var(--linha); border-radius:8px;
  background:var(--fundo-2); color:var(--tinta);
}
.portao-erro{min-height:18px; font-size:13px; color:var(--ambar) !important}
@media print{ .portao{display:none !important} }
</style>
</head>
<body>
<div class="portao" id="portao">
  <div class="portao-caixa">
    <h1>Contrato de Locação</h1>
    <p id="portao-texto">Digite a senha para entrar.</p>
    <input type="password" id="portao-senha" placeholder="Senha" autocomplete="current-password">
    <input type="password" id="portao-senha2" placeholder="Repita a senha" autocomplete="new-password" hidden>
    <button class="bt principal" id="portao-bt">Entrar</button>
    <p class="portao-erro" id="portao-erro"></p>
  </div>
</div>
<script>
/* O portão nasce fechando a tela. Quem já entrou uma vez passa direto,
   sem piscar a senha; quem não entrou nunca vê o formulário por trás. */
try{ if(localStorage.getItem("clv:token")) document.getElementById("portao").classList.add("oculto"); }catch(e){}
</script>

<header class="topo so-tela">
  <div class="topo-in">
    <div class="marca">
      <b>Contrato de Locação</b>
      <span id="rot-veiculo">Renault Megane E-Tech</span>
    </div>
    <div class="estado" id="estado">Carregando</div>
  </div>
  <div class="abas" role="tablist">
    <button class="aba" role="tab" id="tab-form" aria-selected="true" aria-controls="tela-form">Preencher</button>
    <button class="aba" role="tab" id="tab-doc" aria-selected="false" aria-controls="tela-doc">Contrato</button>
    <button class="aba" role="tab" id="tab-lista" aria-selected="false" aria-controls="tela-lista">Locações</button>
  </div>
</header>

<main>
  <section class="tela form" id="tela-form" role="tabpanel" aria-labelledby="tab-form"></section>

  <section class="tela lista oculto" id="tela-lista" role="tabpanel" aria-labelledby="tab-lista">
    <div class="grupo" open>
      <div class="corpo" style="padding-top:16px">
        <div class="lista" id="lista-locacoes"></div>
        <button class="bt" id="bt-nova">Começar uma locação nova</button>
        <button class="bt" id="bt-modelo">Salvar os dados fixos desta tela como modelo</button>
        <p style="font-size:12.5px;color:var(--tinta-3);margin:0">
          As locações ficam guardadas no servidor da AXIS, protegidas por senha. Preencha no celular na hora da entrega e abra no computador para imprimir.
        </p>
      </div>
    </div>
  </section>

  <section class="tela oculto" id="tela-doc" role="tabpanel" aria-labelledby="tab-doc">
    <div class="grupo so-tela" open>
      <div class="corpo" style="padding-top:16px">
        <div class="campo">
          <label for="modo-impressao">O que imprimir</label>
          <select id="modo-impressao">
            <option value="tudo">Contrato completo com o Anexo I</option>
            <option value="anexo">Somente o Anexo I, vistoria da semana</option>
          </select>
        </div>
      </div>
    </div>
    <div class="folha" id="folha"></div>
  </section>
</main>

<div class="barra so-tela">
  <div class="barra-in" id="barra"></div>
</div>

<script>
"use strict";

/* ============ dados padrão ============ */
const PADRAO = {
  locadora:{ nome:"", nacionalidade:"brasileira", nascimento:"", natural:"", estadoCivil:"",
    profissao:"", cpf:"", rg:"", endereco:"", whatsapp:"" },
  locatario:{ nome:"", nacionalidade:"brasileiro", nascimento:"", natural:"", estadoCivil:"",
    profissao:"motorista de aplicativo", cpf:"", rg:"", cnh:"", categoria:"B",
    endereco:"", whatsapp:"" },
  anuente:{ nome:"", nacionalidade:"brasileiro", nascimento:"", natural:"", estadoCivil:"",
    profissao:"", cpf:"", rg:"", endereco:"", whatsapp:"" },
  veiculo:{ marcaModelo:"", especie:"", ano:"", cor:"", combustivel:"", placa:"",
    renavam:"", chassi:"", km:"" },
  seguro:{ apolice:"", seguradora:"", franquia:"", vigenciaIni:"", vigenciaFim:"", cnpjFinanceira:"" },
  valores:{ semanal:"", caucao:"", pagamento:"PIX", multaIndicacaoValor:"", multaIndicacaoPct:"50", foro:"" },
  fecho:{ cidade:"", dia:"", mes:"", ano:String(new Date().getFullYear()),
    test1Nome:"", test1Cpf:"", test2Nome:"", test2Cpf:"" },
  vistoria:{ tipo:"Entrega inicial", data:"", hora:"", local:"", km:"", bateria:"", observacoes:"" },
  itens:{}, fotos:[]
};

/* Blocos que se repetem em toda locação e ficam guardados como modelo.
   O locatário e a vistoria mudam a cada aluguel, por isso ficam de fora. */
const BLOCOS_MODELO = ["locadora","anuente","veiculo","seguro","valores"];

const ITENS = [
  "Lataria dianteira","Lataria lateral direita","Lataria lateral esquerda","Lataria traseira / teto",
  "Para-brisas e vidros","Faróis e lanternas","Pneus (4 unidades)","Rodas / calotas","Retrovisores",
  "Pintura (riscos/amassados)","Estofamento / bancos","Painel / luzes de alerta acesas",
  "Cabo e conector de recarga","Documentos do veículo (CRLV) no porta-luvas",
  "Itens obrigatórios (triângulo, macaco etc.)","Limpeza geral interna e externa"
];

const PESSOA_CAMPOS = [
  {k:"nome", r:"Nome completo", larg:"cheia"},
  {k:"nacionalidade", r:"Nacionalidade"},
  {k:"nascimento", r:"Nascimento", ph:"00/00/0000", mono:true},
  {k:"natural", r:"Natural de", ph:"Cidade/UF"},
  {k:"estadoCivil", r:"Estado civil"},
  {k:"profissao", r:"Profissão"},
  {k:"cpf", r:"CPF", ph:"000.000.000-00", mono:true},
  {k:"rg", r:"RG", ph:"00.000.000 (SSP/SP)", mono:true},
  {k:"endereco", r:"Endereço completo com CEP", larg:"cheia"},
  {k:"whatsapp", r:"WhatsApp", ph:"(11) 00000-0000", mono:true}
];
const LOCATARIO_CAMPOS = PESSOA_CAMPOS.slice(0,8)
  .concat([{k:"cnh", r:"CNH", mono:true},{k:"categoria", r:"Categoria"}])
  .concat(PESSOA_CAMPOS.slice(8));

/* ============ estado ============ */
let st = null;
let idAtual = null;
let db = null;
let listaLocacoes = [];
let salvarTimer = null;

const LS_DOC = id => "clv:doc:" + id;
const LS_IDX = "clv:idx";
const LS_ULT = "clv:ultimo";

function clonar(o){ return JSON.parse(JSON.stringify(o)); }
function novoId(){
  return "loc-" + Date.now().toString(36) + "-" + Math.random().toString(36).slice(2,7);
}
function estadoNovo(){
  const s = clonar(PADRAO);
  ITENS.forEach((n,i) => s.itens["i"+i] = {estado:"", obs:""});
  return s;
}

/* ============ util ============ */
function num(v){
  if(v === null || v === undefined) return NaN;
  const t = String(v).replace(/\s/g,"").replace(/\./g,"").replace(",",".");
  return t === "" ? NaN : Number(t);
}
function moeda(v){
  const n = num(v);
  if(isNaN(n)) return "";
  return n.toLocaleString("pt-BR",{minimumFractionDigits:2, maximumFractionDigits:2});
}
const UNI = ["zero","um","dois","três","quatro","cinco","seis","sete","oito","nove","dez","onze","doze",
  "treze","quatorze","quinze","dezesseis","dezessete","dezoito","dezenove"];
const DEZ = ["","","vinte","trinta","quarenta","cinquenta","sessenta","setenta","oitenta","noventa"];
const CEN = ["","cento","duzentos","trezentos","quatrocentos","quinhentos","seiscentos","setecentos","oitocentos","novecentos"];
function trio(n){
  if(n === 100) return "cem";
  let p = [];
  const c = Math.floor(n/100), r = n%100;
  if(c) p.push(CEN[c]);
  if(r){
    if(r < 20) p.push(UNI[r]);
    else{
      const d = Math.floor(r/10), u = r%10;
      p.push(u ? DEZ[d] + " e " + UNI[u] : DEZ[d]);
    }
  }
  return p.join(" e ");
}
function juntar(p){
  if(p.length === 0) return "";
  if(p.length === 1) return p[0];
  return p.slice(0,-1).join(", ") + " e " + p[p.length-1];
}
function extensoInt(n){
  if(n === 0) return "zero";
  const mi = Math.floor(n/1000000), mil = Math.floor((n%1000000)/1000), res = n%1000;
  let p = [];
  if(mi) p.push(mi === 1 ? "um milhão" : trio(mi) + " milhões");
  if(mil) p.push(mil === 1 ? "mil" : trio(mil) + " mil");
  if(res) p.push(trio(res));
  return juntar(p);
}
function extensoReais(v){
  const n = num(v);
  if(isNaN(n)) return "";
  const int = Math.floor(n + 1e-9);
  const cent = Math.round((n - int) * 100);
  let t = extensoInt(int) + (int === 1 ? " real" : " reais");
  if(cent > 0) t += " e " + extensoInt(cent) + (cent === 1 ? " centavo" : " centavos");
  return t;
}
function esc(s){
  return String(s === null || s === undefined ? "" : s)
    .replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;");
}
/* valor preenchido, ou lacuna visível quando falta */
function v(txt, larg){
  const t = String(txt === null || txt === undefined ? "" : txt).trim();
  if(t) return '<span class="val">' + esc(t) + "</span>";
  return '<span class="vazio">' + "_".repeat(larg || 24) + "</span>";
}

/* ============ persistência: API da AXIS ============ */
let token = null;
try{ token = localStorage.getItem("clv:token"); }catch(e){}

async function api(rota, corpo){
  const opc = { method: corpo ? "POST" : "GET", headers:{} };
  if(token) opc.headers["Authorization"] = "Bearer " + token;
  if(corpo){ opc.headers["Content-Type"] = "application/json"; opc.body = JSON.stringify(corpo); }
  const r = await fetch(rota, opc);
  if(r.status === 401){
    token = null;
    try{ localStorage.removeItem("clv:token"); }catch(e){}
    abrirPortao("Sua sessão expirou. Entre de novo.");
    throw new Error("sessao");
  }
  return r.json();
}

function indiceLocal(){

function resumo(){

/* ============ fotos ============ */
function comprimir(arquivo){
  return new Promise((ok, falha) => {
    const leitor = new FileReader();
    leitor.onerror = () => falha(new Error("leitura"));
    leitor.onload = () => {
      const img = new Image();
      img.onerror = () => falha(new Error("imagem"));
      img.onload = () => {
        const max = 1100;
        let {width:w, height:h} = img;
        if(w > h && w > max){ h = Math.round(h * max / w); w = max; }
        else if(h >= w && h > max){ w = Math.round(w * max / h); h = max; }
        const c = document.createElement("canvas");
        c.width = w; c.height = h;
        c.getContext("2d").drawImage(img, 0, 0, w, h);
        let q = 0.72, url = c.toDataURL("image/jpeg", q);
        while(url.length > 190000 && q > 0.32){ q -= 0.1; url = c.toDataURL("image/jpeg", q); }
        ok(url);
      };
      img.src = leitor.result;
    };
    leitor.readAsDataURL(arquivo);
  });
}
async function receberFotos(ev){
  const arquivos = Array.from(ev.target.files || []);
  ev.target.value = "";
  for(const a of arquivos){
    if(st.fotos.length >= 24){ estado("Limite de 24 fotos"); break; }
    try{
      const url = await comprimir(a);
      const f = {id:"f" + Date.now().toString(36) + Math.random().toString(36).slice(2,6),
                 url, legenda:"", ordem:st.fotos.length};
      st.fotos.push(f);
      desenharFotos();
      gravarLocal();
      salvarFotoNuvem(f);
    }catch(e){ estado("Não consegui ler uma das fotos"); }
  }
}

    "</div>").join("") +

  document.getElementById("cont-fotos").textContent =

  document.getElementById("bt-add-foto").addEventListener("click",

  }));
  g.querySelectorAll("input[data-leg]").forEach(inp => inp.addEventListener("input", () => {
    const f = st.fotos.find(x => x.id === inp.dataset.leg);
    if(f){ f.legenda = inp.value; gravarLocal(); clearTimeout(salvarTimer);

  "<p>As partes acima identificadas têm, entre si, justo e acertado o presente Contrato de Locação de Veículo Automotor, que se regerá pelas cláusulas seguintes e pela legislação aplicável, em especial os artigos 565 a 578 do Código Civil e o Código de Trânsito Brasileiro.</p>" +

  "<h2>Cláusula 1ª, do objeto</h2>" +

  "<h2>Cláusula 18ª, do foro</h2>" +

  const anexo =
  '<h1>Anexo I, Termo de Vistoria do Veículo</h1>' +

  '<p class="local-data">' + v(s.fecho.cidade, 12) + ", " + v(s.vistoria.data || s.fecho.dia, 12) + ".</p>" +

function desenharDocumento(){
  document.getElementById("folha").innerHTML = montarDocumento();
}

/* ============ lista ============ */
function desenharLista(){
  const alvo = document.getElementById("lista-locacoes");
  if(!listaLocacoes.length){
    alvo.innerHTML = '<p style="font-size:13.5px;color:var(--tinta-3);margin:0">Nenhuma locação guardada ainda.</p>';
    return;
  }
  alvo.innerHTML = listaLocacoes.map(r => {
    const d = r.atualizado ? new Date(r.atualizado).toLocaleDateString("pt-BR") : "";
    return '<button class="linha-loc" data-id="' + esc(r.id) + '" aria-current="' + (r.id === idAtual) + '">' +
      '<span class="qm"><b>' + esc(r.nome) + "</b><span>" + esc(r.placa) + (d ? "  " + d : "") + "</span></span>" +
      '<span class="apagar" data-apagar="' + esc(r.id) + '">Excluir</span></button>';
  }).join("");
  alvo.querySelectorAll(".linha-loc").forEach(b => {
    b.addEventListener("click", async ev => {
      const el = ev.target;
      if(el.dataset && el.dataset.apagar){
        ev.stopPropagation();
        if(!confirm("Excluir esta locação? Não dá para desfazer.")) return;
        await excluir(el.dataset.apagar);
        return;
      }
      await abrir(b.dataset.id);
      trocarAba("form");
    });
  });
}
async function excluir(id){
  try{
    localStorage.removeItem(LS_DOC(id));
    localStorage.setItem(LS_IDX, JSON.stringify(indiceLocal().filter(x => x.id !== id)));
  }catch(e){}
  if(token){ try{ await api("/api/locacao/excluir", {id}); }catch(e){} }
  if(id === idAtual) await novaLocacao();
  await listar();
}
async function abrir(id){
  let s = null;
  try{ s = await carregarNuvem(id); }catch(e){}
  if(!s){
    try{ s = JSON.parse(localStorage.getItem(LS_DOC(id)) || "null"); }catch(e){}
  }
  if(!s) return;
  const base = estadoNovo();
  st = Object.assign(base, s);
  st.itens = Object.assign(base.itens, s.itens || {});
  st.fotos = s.fotos || [];
  idAtual = id;
  try{ localStorage.setItem(LS_ULT, id); }catch(e){}
  desenharForm();
  desenharDocumento();
  estado(token ? "Salvo no servidor" : "Salvo neste aparelho", true);
}
async function novaLocacao(){
  st = estadoNovo();
  aplicarModelo(st, await lerModelo());
  idAtual = novoId();
  desenharForm();
  desenharDocumento();
  gravarLocal();
  estado("Locação nova");
  trocarAba("form");
  window.scrollTo(0,0);
}

/* ============ abas e barra ============ */
function trocarAba(qual){
  const mapa = {form:"tela-form", doc:"tela-doc", lista:"tela-lista"};
  Object.keys(mapa).forEach(k => {
    document.getElementById("tab-" + k).setAttribute("aria-selected", String(k === qual));
    document.getElementById(mapa[k]).classList.toggle("oculto", k !== qual);
  });
  if(qual === "doc") desenharDocumento();
  if(qual === "lista") listar();
  desenharBarra(qual);
  window.scrollTo(0,0);
}
function desenharBarra(qual){
  const b = document.getElementById("barra");
  if(qual === "doc"){
    b.innerHTML = '<button class="bt menor" id="bt-voltar">Voltar</button>' +
                  '<button class="bt principal" id="bt-imprimir">Imprimir</button>';
    document.getElementById("bt-voltar").onclick = () => trocarAba("form");
    document.getElementById("bt-imprimir").onclick = () => { desenharDocumento(); setTimeout(() => window.print(), 60); };
  }else if(qual === "lista"){
    b.innerHTML = '<button class="bt principal" id="bt-voltar2">Voltar para o formulário</button>';
    document.getElementById("bt-voltar2").onclick = () => trocarAba("form");
  }else{
    b.innerHTML = '<button class="bt menor" id="bt-lista">Locações</button>' +
                  '<button class="bt principal" id="bt-ver">Ver contrato pronto</button>';
    document.getElementById("bt-lista").onclick = () => trocarAba("lista");
    document.getElementById("bt-ver").onclick = () => trocarAba("doc");
  }
}

/* ============ portão de entrada ============ */
function abrirPortao(msg){
  const p = document.getElementById("portao");
  p.classList.remove("oculto");
  document.getElementById("portao-erro").textContent = msg || "";
  document.getElementById("portao-senha").focus();
}
function fecharPortao(){ document.getElementById("portao").classList.add("oculto"); }

async function iniciarPortao(){
  let primeira = false;
  try{
    const r = await fetch("/api/locacao/status").then(x => x.json());
    primeira = r && r.ok && !r.definida;
  }catch(e){}
  const t2 = document.getElementById("portao-senha2");
  const bt = document.getElementById("portao-bt");
  document.getElementById("portao-texto").textContent = primeira
    ? "Ninguém cadastrou senha ainda. Escolha a sua agora, com pelo menos 6 caracteres."
    : "Digite a senha para entrar.";
  t2.hidden = !primeira;
  bt.textContent = primeira ? "Criar senha e entrar" : "Entrar";

  async function enviar(){
    const s1 = document.getElementById("portao-senha").value;
    const err = document.getElementById("portao-erro");
    err.textContent = "";
    bt.disabled = true;
    try{
      let r;
      if(primeira){
        if(s1.length < 6){ err.textContent = "A senha precisa de pelo menos 6 caracteres."; bt.disabled = false; return; }
        if(s1 !== t2.value){ err.textContent = "As duas senhas estão diferentes."; bt.disabled = false; return; }
        r = await fetch("/api/locacao/senha", {method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({senhaNova:s1})}).then(x => x.json());
      }else{
        r = await fetch("/api/locacao/entrar", {method:"POST", headers:{"Content-Type":"application/json"},
          body:JSON.stringify({senha:s1})}).then(x => x.json());
      }
      if(!r || !r.ok){ err.textContent = (r && r.error) || "Não consegui entrar."; bt.disabled = false; return; }
      token = r.token;
      try{ localStorage.setItem("clv:token", token); }catch(e){}
      fecharPortao();
      await depoisDeEntrar();
    }catch(e){ err.textContent = "Falha de conexão. Tente de novo."; }
    bt.disabled = false;
  }
  bt.onclick = enviar;
  document.getElementById("portao-senha").addEventListener("keydown", e => { if(e.key === "Enter" && !primeira) enviar(); });
  t2.addEventListener("keydown", e => { if(e.key === "Enter") enviar(); });
}

/* Semear o modelo por link: abrir a página uma vez com #modelo=<base64>
   grava os dados fixos no banco sem que eles passem pelo código. */
async function semearPeloLink(){
  const h = location.hash || "";
  if(!h.startsWith("#modelo=")) return false;
  try{
    const bruto = decodeURIComponent(escape(atob(h.slice(8).replace(/-/g,"+").replace(/_/g,"/"))));
    const modelo = JSON.parse(bruto);
    BLOCOS_MODELO.forEach(b => { if(modelo[b]) st[b] = Object.assign(st[b], modelo[b]); });
    history.replaceState(null, "", location.pathname);
    const ok = await salvarModelo();
    estado(ok ? "Modelo gravado" : "Modelo só neste aparelho", ok);
    return true;
  }catch(e){ return false; }
}

async function depoisDeEntrar(){
  const semeou = await semearPeloLink();
  if(!semeou){
    const modelo = await lerModelo();
    if(modelo && !st.locadora.nome) aplicarModelo(st, modelo);
  }
  desenharForm();
  desenharDocumento();
  await listar();
  if(!semeou) salvarNuvem();
}

/* ============ início ============ */
(async function(){
  let ultimo = null;
  try{ ultimo = localStorage.getItem(LS_ULT); }catch(e){}
  let carregado = false;
  if(ultimo){
    try{
      const s = JSON.parse(localStorage.getItem(LS_DOC(ultimo)) || "null");
      if(s){
        const base = estadoNovo();
        st = Object.assign(base, s);
        st.itens = Object.assign(base.itens, s.itens || {});
        st.fotos = s.fotos || [];
        idAtual = ultimo; carregado = true;
      }
    }catch(e){}
  }
  if(!carregado){ st = estadoNovo(); idAtual = novoId(); }

  document.getElementById("tab-form").onclick = () => trocarAba("form");
  document.getElementById("tab-doc").onclick = () => trocarAba("doc");
  document.getElementById("tab-lista").onclick = () => trocarAba("lista");
  document.getElementById("bt-nova").onclick = novaLocacao;
  document.getElementById("bt-modelo").onclick = async () => {
    const ok = await salvarModelo();
    estado(ok ? "Modelo atualizado" : "Não consegui salvar o modelo", ok);
    alert(ok
      ? "Pronto. Locadora, proprietário, veículo, seguro e valores desta tela vão vir preenchidos na próxima locação."
      : "Não consegui salvar o modelo agora. Tente de novo com o celular conectado.");
  };
  document.getElementById("modo-impressao").onchange = desenharDocumento;

  desenharForm();
  desenharDocumento();
  desenharBarra("form");

  if(token){
    estado("Conectado", true);
    await depoisDeEntrar();
  }else{
    estado("Fora do ar");
    await iniciarPortao();
    abrirPortao("");
  }
})();
</script>
